name: sync-wallets

# Applies the repo variables TREASURY_ADDRESS and FOUNDATION_ADDRESS to the
# contract (Settings -> Secrets and variables -> Actions -> Variables).
# Run it manually after changing either variable; it also runs before every
# monthly draw. Signs with the bot key, which holds the on-chain walletAdmin
# role: it can change these two payout addresses and nothing else.
on:
  workflow_dispatch: {}

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --omit=dev
        working-directory: bot
      - run: node sync-wallets.mjs
        working-directory: bot
        env:
          RAFFLE_ADDRESS: ${{ vars.RAFFLE_ADDRESS }}
          TREASURY_ADDRESS: ${{ vars.TREASURY_ADDRESS }}
          FOUNDATION_ADDRESS: ${{ vars.FOUNDATION_ADDRESS }}
          WALLET_ADMIN_PRIVATE_KEY: ${{ secrets.BOT_PRIVATE_KEY }}
