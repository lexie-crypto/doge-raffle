name: draw-bot

# Draws happen on the 1st of every month at 00:00 UTC. Check every six hours
# so a missed first run or a silent VRF oracle still reaches the permissionless
# fallback. Runs outside a draw window exit without submitting transactions.
on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch: {}

concurrency:
  group: draw-bot
  cancel-in-progress: false

jobs:
  draw:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci --omit=dev
        working-directory: bot
      # A payout-address sync error is reported after settlement. It must not
      # prevent the keeper from drawing an existing pot.
      - name: Sync payout wallets
        id: sync
        continue-on-error: true
        run: node sync-wallets.mjs
        working-directory: bot
        env:
          RAFFLE_ADDRESS: ${{ vars.RAFFLE_ADDRESS }}
          TREASURY_ADDRESS: ${{ vars.TREASURY_ADDRESS }}
          FOUNDATION_ADDRESS: ${{ vars.FOUNDATION_ADDRESS }}
          WALLET_ADMIN_PRIVATE_KEY: ${{ secrets.BOT_PRIVATE_KEY }}
      - run: node draw-bot.mjs
        working-directory: bot
        env:
          RAFFLE_ADDRESS: ${{ vars.RAFFLE_ADDRESS }}
          BOT_PRIVATE_KEY: ${{ secrets.BOT_PRIVATE_KEY }}
          WINDOW_HOURS: "1" # if cron fires a little early, wait for 00:00
      # VRF oracle responder: proves and fulfills pending randomness requests.
      # Runs after the draw step so a commitDraw lands in the same pass.
      - run: node vrf-oracle.mjs
        if: ${{ !cancelled() && vars.COORDINATOR_ADDRESS != '' }}
        working-directory: bot
        env:
          COORDINATOR_ADDRESS: ${{ vars.COORDINATOR_ADDRESS }}
          VRF_SECRET_KEY: ${{ secrets.VRF_SECRET_KEY }}
          ORACLE_PRIVATE_KEY: ${{ secrets.BOT_PRIVATE_KEY }}
      - name: Report payout sync failure
        if: ${{ !cancelled() && steps.sync.outcome == 'failure' }}
        run: exit 1
