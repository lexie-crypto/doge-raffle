name: activate-raffle-v2

# One-time Chikyu testnet cutover; old DOGE stays in the old contract.
on:
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  activate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          submodules: true
      - uses: foundry-rs/foundry-toolchain@b00af27efadbc7b4ca8b82abbd903b17cc874d2a # v1.9.0
        with:
          version: v1.9.0
      - name: Check owner secret
        env:
          DEPLOYER_PRIVATE_KEY: ${{ secrets.DEPLOYER_PRIVATE_KEY }}
        run: test -n "$DEPLOYER_PRIVATE_KEY" || { echo '::error::Missing DEPLOYER_PRIVATE_KEY'; exit 1; }
      - name: Pause old sales and activate v2
        working-directory: contracts
        env:
          DEPLOYER_PRIVATE_KEY: ${{ secrets.DEPLOYER_PRIVATE_KEY }}
          OLD_RAFFLE_ADDRESS: "0x0B0024090b1a2BD99128654E0047BB27fE30D05C"
          NEW_RAFFLE_ADDRESS: "0x5665F2A606E548306e38d98a05335845F05Ec70b"
          TREASURY_ADDRESS: ${{ vars.TREASURY_ADDRESS }}
          FOUNDATION_ADDRESS: ${{ vars.FOUNDATION_ADDRESS }}
        run: forge script script/ActivateRaffleV2.s.sol:ActivateRaffleV2 --rpc-url dogeos_testnet --broadcast --slow
