[profile.default]
src = "src"
out = "out"
libs = ["lib"]
solc_version = "0.8.31"
evm_version = "osaka"
optimizer = true
optimizer_runs = 2000
via_ir = true
# ffi is used by the VRF tests to generate real ECVRF proofs with the
# off-chain prover (bot/ecvrf-cli.mjs) and verify them on-chain.
ffi = true

remappings = [
    "@openzeppelin/=lib/openzeppelin-contracts/",
    "forge-std/=lib/forge-std/src/",
]

[rpc_endpoints]
dogeos_testnet = "https://rpc.testnet.dogeos.com/"

# DogeOS Chikyu testnet: chain id 6281971, native DOGE gas token.
# Explorer: https://dogeos-testnet.l2scan.co
