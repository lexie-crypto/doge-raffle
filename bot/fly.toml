# fly.toml app configuration file generated for doge-raffle on 2026-11-06T19:19:19Z
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'doge-raffle'
primary_region = 'ams'

[build]
  dockerfile = 'Dockerfile'

[env]
  POLL_MS = '3000'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

[[vm]]
  size = 'shared-cpu-1x'
  memory = '256mb'
